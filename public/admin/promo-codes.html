<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Управление промокодами</title>
    <link rel="stylesheet" href="./admin.css" />
    <style>
      .promo-layout {
        min-height: 100vh;
        background: #f5f5f6;
        padding: 24px;
      }
      .promo-container {
        max-width: 1200px;
        margin: 0 auto;
        display: grid;
        grid-template-columns: 420px 1fr;
        gap: 18px;
      }
      .promo-header {
        max-width: 1200px;
        margin: 0 auto 16px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }
      .promo-card {
        background: #fff;
        border: 1px solid #dedee2;
        padding: 16px;
      }
      .promo-card h2 {
        margin: 0 0 14px;
      }
      .promo-table-wrap {
        overflow: auto;
      }
      .promo-table {
        width: 100%;
        border-collapse: collapse;
        font-size: 14px;
      }
      .promo-table th,
      .promo-table td {
        border-bottom: 1px solid #ececf0;
        padding: 8px;
        text-align: left;
        vertical-align: top;
      }
      .promo-row-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }
      .badge {
        display: inline-block;
        border: 1px solid #d8d8de;
        padding: 2px 8px;
        font-size: 12px;
      }
      .badge.on {
        border-color: #79a878;
        color: #2f7a2f;
      }
      .promo-status {
        margin-top: 10px;
        font-size: 13px;
        color: #555;
        min-height: 20px;
      }
      .promo-status.error {
        color: #b64545;
      }
      .promo-status.success {
        color: #2f7a2f;
      }
      @media (max-width: 1000px) {
        .promo-container {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div class="promo-layout">
      <div class="promo-header">
        <h1 style="margin:0;">Промокоды</h1>
        <div class="toolbar">
          <a class="btn" href="./admin.html">← Назад в CMS</a>
          <a class="btn" href="/">Открыть сайт</a>
        </div>
      </div>

      <div class="promo-container">
        <section class="promo-card">
          <h2>Настройки API</h2>
          <div class="stacked-form">
            <label>
              Базовый URL API
              <input id="api-base" type="text" placeholder="http://127.0.0.1:8787" />
            </label>
            <label>
              ADMIN_API_TOKEN
              <input id="admin-token" type="password" placeholder="Введите админ токен" />
            </label>
            <div class="toolbar">
              <button id="save-config" class="btn" type="button">Сохранить</button>
              <button id="load-list" class="btn btn-primary" type="button">Загрузить промокоды</button>
            </div>
          </div>

          <hr class="section-separator" />

          <h2>Создать / изменить</h2>
          <form id="promo-form" class="stacked-form">
            <input id="promo-id" type="hidden" />
            <label>
              Код
              <input id="promo-code" type="text" required placeholder="WELCOME10" />
            </label>
            <label>
              Скидка (%)
              <input id="promo-discount" type="number" min="1" max="100" required />
            </label>
            <label>
              Минимальная сумма заказа
              <input id="promo-min-order" type="number" min="0" step="1" value="0" />
            </label>
            <label>
              Лимит использований (всего)
              <input id="promo-max-total" type="number" min="1" placeholder="пусто = без лимита" />
            </label>
            <label>
              Лимит на пользователя
              <input id="promo-max-user" type="number" min="1" placeholder="пусто = без лимита" />
            </label>
            <label>
              Действует с
              <input id="promo-starts" type="datetime-local" />
            </label>
            <label>
              Действует до
              <input id="promo-ends" type="datetime-local" />
            </label>
            <label style="display:flex;align-items:center;gap:8px;">
              <input id="promo-active" type="checkbox" checked />
              Активен
            </label>
            <div class="toolbar">
              <button class="btn btn-primary" type="submit">Сохранить промокод</button>
              <button id="clear-form" class="btn" type="button">Очистить форму</button>
            </div>
          </form>

          <p id="promo-status" class="promo-status"></p>
        </section>

        <section class="promo-card">
          <h2>Список промокодов</h2>
          <div class="promo-table-wrap">
            <table class="promo-table">
              <thead>
                <tr>
                  <th>Код</th>
                  <th>Скидка</th>
                  <th>Лимиты</th>
                  <th>Период</th>
                  <th>Статус</th>
                  <th>Действия</th>
                </tr>
              </thead>
              <tbody id="promo-table-body"></tbody>
            </table>
          </div>
        </section>
      </div>
    </div>

    <script type="module" src="./promo-codes.js"></script>
  </body>
  </html>
