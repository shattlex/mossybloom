<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Админка промокодов</title>
    <style>
      :root {
        --bg: #f5f5f6;
        --surface: #ffffff;
        --line: #dedee2;
        --text: #2e2e33;
        --muted: #70707a;
        --accent: #b77f92;
        --danger: #b64545;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: "PT Sans", "Segoe UI", Arial, sans-serif;
        color: var(--text);
        background: var(--bg);
      }
      .layout {
        max-width: 1240px;
        margin: 0 auto;
        padding: 24px;
      }
      .header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        margin-bottom: 18px;
      }
      .header h1 {
        margin: 0;
        font-size: 32px;
      }
      .grid {
        display: grid;
        grid-template-columns: 420px 1fr;
        gap: 16px;
      }
      .card {
        background: var(--surface);
        border: 1px solid var(--line);
        padding: 16px;
      }
      .card h2 {
        margin: 0 0 12px;
      }
      .stacked-form {
        display: grid;
        gap: 10px;
      }
      .stacked-form label {
        display: grid;
        gap: 4px;
        font-size: 14px;
      }
      .toolbar {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }
      .btn {
        border: 1px solid #c5c5cb;
        background: #fff;
        color: #2f2f35;
        padding: 8px 12px;
        cursor: pointer;
        text-decoration: none;
      }
      .btn-primary {
        background: var(--accent);
        border-color: var(--accent);
        color: #fff;
      }
      .btn-danger {
        border-color: var(--danger);
        color: var(--danger);
      }
      input {
        width: 100%;
        border: 1px solid #d8d8de;
        padding: 8px 10px;
        font: inherit;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 14px;
      }
      th,
      td {
        border-bottom: 1px solid #ececf0;
        padding: 8px;
        text-align: left;
        vertical-align: top;
      }
      .badge {
        display: inline-block;
        border: 1px solid #d8d8de;
        padding: 2px 8px;
        font-size: 12px;
      }
      .badge.on {
        border-color: #79a878;
        color: #2f7a2f;
      }
      .row-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }
      .status {
        margin-top: 10px;
        min-height: 18px;
        font-size: 13px;
      }
      .status.success {
        color: #2f7a2f;
      }
      .status.error {
        color: var(--danger);
      }
      .note {
        color: var(--muted);
        font-size: 13px;
      }
      @media (max-width: 1000px) {
        .grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div class="layout">
      <div class="header">
        <h1>Промокоды</h1>
        <a class="btn" href="/">Открыть сайт</a>
      </div>

      <div class="grid">
        <section class="card">
          <h2>Подключение к API</h2>
          <div class="stacked-form">
            <label>
              Базовый URL API
              <input id="api-base" type="text" placeholder="http://127.0.0.1:8787" />
            </label>
            <label>
              ADMIN_API_TOKEN
              <input id="admin-token" type="password" placeholder="Введите токен" />
            </label>
            <div class="toolbar">
              <button id="save-config" class="btn" type="button">Сохранить</button>
              <button id="load-list" class="btn btn-primary" type="button">Загрузить промокоды</button>
            </div>
          </div>

          <hr />

          <h2>Создать / изменить промокод</h2>
          <form id="promo-form" class="stacked-form">
            <input id="promo-id" type="hidden" />
            <label>
              Код
              <input id="promo-code" type="text" required placeholder="WELCOME10" />
            </label>
            <label>
              Скидка (%)
              <input id="promo-discount" type="number" min="1" max="100" required />
            </label>
            <label>
              Минимальная сумма заказа
              <input id="promo-min-order" type="number" min="0" step="1" value="0" />
            </label>
            <label>
              Лимит использований (всего)
              <input id="promo-max-total" type="number" min="1" placeholder="пусто = без лимита" />
            </label>
            <label>
              Лимит на пользователя
              <input id="promo-max-user" type="number" min="1" placeholder="пусто = без лимита" />
            </label>
            <label>
              Действует с
              <input id="promo-starts" type="datetime-local" />
            </label>
            <label>
              Действует до
              <input id="promo-ends" type="datetime-local" />
            </label>
            <label>
              <input id="promo-active" type="checkbox" checked />
              Активен
            </label>
            <div class="toolbar">
              <button class="btn btn-primary" type="submit">Сохранить</button>
              <button id="clear-form" class="btn" type="button">Очистить форму</button>
            </div>
          </form>
          <p id="promo-status" class="status"></p>
          <p class="note">Страница отдельная от CMS. Откройте напрямую: <code>/promo-admin.html</code>.</p>
        </section>

        <section class="card">
          <h2>Список промокодов</h2>
          <table>
            <thead>
              <tr>
                <th>Код</th>
                <th>Скидка</th>
                <th>Лимиты</th>
                <th>Период</th>
                <th>Статус</th>
                <th>Действия</th>
              </tr>
            </thead>
            <tbody id="promo-table-body"></tbody>
          </table>
        </section>
      </div>
    </div>

    <script type="module" src="./promo-admin.js"></script>
  </body>
  </html>
